name: Check iPhone build

# Run explicitly: Mac build minutes can have a cost. This does not distribute a beta.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Compile-only configuration; never use this artifact for tester distribution.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - run: npm ci
      - run: npm test
      - run: npm run ios:prepare

      - name: Compile the saved iPhone project without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/TodoerDerivedData" \
            build CODE_SIGNING_ALLOWED=NO

      # Use Xcode Organizer for the first signed, reviewed TestFlight build.
      # See docs/iphone-beta-2026-09-14.md before adding automated signing/upload.
